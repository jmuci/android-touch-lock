name: Maestro Tests

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  test:
    name: Run Maestro Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          # Disable caching temporarily due to GitHub Actions cache service issues
          # Re-enable by removing this line once GitHub resolves the cache service issue
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_3
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            # SYSTEM_ALERT_WINDOW and POST_NOTIFICATIONS are checked by the app before it will
            # show the overlay / post its foreground-service notification (see CLAUDE.md); the
            # lock_and_unlock flow depends on both already being granted, same as a real user
            # would grant them, since Maestro itself can't drive the system permission dialogs
            # reliably across API levels.
            adb shell appops set com.tenmilelabs.touchlock SYSTEM_ALERT_WINDOW allow
            adb shell pm grant com.tenmilelabs.touchlock android.permission.POST_NOTIFICATIONS
            maestro test .maestro/flows/lock_and_unlock.yaml

      - name: Upload Maestro test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-test-results
          path: ~/.maestro/tests/**
          retention-days: 7
